<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Card Borders</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #030414;
      margin: 0;
      flex-wrap: wrap;
    }

    .card-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 30px;
      padding: 20px;
    }

    /* All the CSS from above goes here */
    .animated-card {
      position: relative;
      width: 300px;
      height: 200px;
      margin: 20px;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      transition: transform 0.3s ease;
    }

    .animated-card::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg,
          #ff6b6b, #ffa502, #ffd700, #00ff00,
          #00bfff, #8a2be2, #ff6b6b);
      background-size: 400% 400%;
      border-radius: 14px;
      z-index: -1;
      animation: gradientBorder 3s ease infinite;
      animation-direction: alternate;
    }

    .animated-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
    }

    @keyframes gradientBorder {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .card-content {
      padding: 20px;
      text-align: center;
      color: #333;
    }

    .card-content h3 {
      margin: 0 0 10px 0;
      font-size: 1.2rem;
    }

    .card-content p {
      margin: 0;
      font-size: 0.9rem;
      color: #666;
    }

    .card {
      margin: 0 auto;
      padding: 2rem;
      width: 300px;
      background: #1c1f2b;
      text-align: center;
      border-radius: 10px;
      position: relative;
      color: mediumseagreen;
    }

    .card::after,
    .card::before {
      content: '';
      position: absolute;
      height: 100%;
      width: 100%;
      top: 50%;
      left: 50%;
      translate: -50% -50%;
      z-index: -1;
      padding: 6px;
      border-radius: 10px;
      background-image: conic-gradient(from var(--angle), transparent 70%, lightseagreen);
      animation: 3s spin linear infinite;
    }

    .card::before {
      filter: blur(1.5rem);
      opacity: 0.5;
    }

    @keyframes spin {
      from {
        --angle: 0deg;
      }

      to {
        --angle: 360deg;
      }
    }

    @property --angle {
      syntax: '<angle>';
      inherits: false;
      initial-value: 0deg;
    }
  </style>
</head>

<body>
  <div class="card-container">
    <div class="card">
      <h3>Moving Border</h3>
      <p>Continuous movement effect</p>
    </div>
  </div>
</body>

</html>
